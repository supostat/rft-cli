[package]
name = "rft-cli"
version = "0.1.0"
edition = "2024"
description = "Zero-config Docker Compose isolation for git worktrees"
license = "MIT"
repository = "https://github.com/ingvar/rft"

[[bin]]
name = "rft"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "process", "fs", "signal"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yml = "0.0.12"
serde_json = "1.0.149"
toml = "1.0.6"
thiserror = "2.0.18"
miette = { version = "7.6", features = ["fancy"] }
owo-colors = "4.3"
comfy-table = "7.2.2"
regex = "1"
rmcp = { version = "1.2", features = ["server", "transport-io"] }
schemars = "1.0"

[dev-dependencies]
tempfile = "3"
